name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "rules/azure/**"
      - "detectctl/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  id-token: write   # lets the job request an OIDC token from GitHub
  contents: read

concurrency:
  group: deploy-sentinel
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Gate - lint and tests
        run: |
          detectctl lint rules
          detectctl test rules
          pytest -q

      - name: Render Sentinel analytics rules
        run: detectctl render rules/azure --out build/sentinel/analytics.json

      - name: Azure login (OIDC, no stored secret)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy analytics rules
        run: |
          az deployment group create \
            -g rg-detection-lab -n analytics-rules \
            --template-file build/sentinel/analytics.json \
            --parameters workspaceName=law-detection-lab \
            --query properties.provisioningState -o tsv
