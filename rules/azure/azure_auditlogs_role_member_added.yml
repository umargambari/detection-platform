title: Member Added to Azure AD Directory Role
id: 5700a298-2ac5-43e4-9b3f-fda0d89dd3c2
status: experimental
description: >
  Detects a user or service principal being added to an Entra directory role.
  Attackers add accounts to privileged roles to escalate privileges and keep
  access to a tenant.
references:
  - https://attack.mitre.org/techniques/T1098/003/
author: Umar Gambari
date: 2026-11-28
tags:
  - attack.persistence
  - attack.privilege-escalation
  - attack.t1098.003
logsource:
  product: azure
  service: auditlogs
detection:
  selection_operation:
    # Entra can pad operation names with a trailing space, so match the prefix
    OperationName|startswith: 'Add member to role'
  selection_result:
    Result: 'success'
  condition: selection_operation and selection_result
falsepositives:
  - Planned role assignments by administrators or onboarding automation
level: medium
