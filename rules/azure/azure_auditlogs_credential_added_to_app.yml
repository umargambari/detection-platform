title: Credential Added to Azure AD Application or Service Principal
id: 021cb8bd-d4af-43c7-bfa1-be726b838b24
status: experimental
description: >
  Detects a new secret or certificate being added to an application
  registration or service principal. Attackers use this to keep access to a
  tenant after a user password reset.
references:
  - https://attack.mitre.org/techniques/T1098/001/
author: Umar Gambari
date: 2026-11-24
tags:
  - attack.persistence
  - attack.t1098.001
logsource:
  product: azure
  service: auditlogs
detection:
  selection_operation:
    # Entra pads some operation names with a trailing space, so match the prefix
    OperationName|startswith:
      - 'Add service principal credentials'
      - 'Update application – Certificates and secrets management'
  selection_result:
    Result: 'success'
  condition: selection_operation and selection_result
falsepositives:
  - Planned secret or certificate rotation by application owners or CI pipelines
level: medium
